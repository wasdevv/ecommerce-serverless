# Ambiente local completo: API + PostgreSQL + Redis + collector OpenTelemetry
# (sidecar) + emuladores de SQS (ElasticMQ) e S3 (MinIO) + servidor do
# recomendador (mesmo contrato do endpoint SageMaker). Nenhuma credencial AWS
# real é usada aqui.
#
#   docker compose up -d --build --wait
#   docker compose run --rm api npm run migrate
#   docker compose run --rm api npm run seed
#
# Recomendação (opcional): histórico demo -> export -> treino. O serve.py
# recarrega o modelo sozinho.
#   docker compose run --rm api npm run seed:history
#   docker compose run --rm -T api npm run -s export:training-data -- - \
#     | docker compose run --rm -T recommender python -m recommender.train - /opt/ml/model
#
# Assistente (POST /api/v1/assistant): indexa o catálogo para a busca vetorial.
#   docker compose run --rm api npm run index:products

x-app-env: &app-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
  ORDER_EVENTS_QUEUE_URL: http://sqs:9324/000000000000/order-events
  AWS_ENDPOINT_URL_SQS: http://sqs:9324
  UPLOADS_BUCKET: uploads
  # Endpoint visto pelo navegador/curl no host, para a URL assinada funcionar fora do compose.
  AWS_ENDPOINT_URL_S3: http://localhost:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local-secret-key
  OTEL_SERVICE_NAME: ecommerce-api
  # O "sidecar": o app só conhece localhost-equivalente do collector, nunca o backend de traces.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Na AWS é RECOMMENDER_ENDPOINT_NAME (SageMaker); aqui, o serve.py.
  RECOMMENDER_URL: http://recommender:8080
  # Assistente: sem chave, responde só com a busca. Com chave no shell
  # (export ANTHROPIC_API_KEY=...), gera a resposta com Claude.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  api:
    build: ./backend
    ports: ["3000:3000"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
      sqs: { condition: service_started }

  jobs:
    build: ./backend
    command: ["node", "scripts/local-jobs.js"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ecommerce-jobs
    depends_on:
      postgres: { condition: service_healthy }
      sqs: { condition: service_started }

  recommender:
    build: ./ml
    ports: ["8080:8080"]
    volumes: [mlmodel:/opt/ml/model]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    volumes: ["./monitoring/elasticmq.conf:/opt/elasticmq.conf:ro"]
    ports: ["9324:9324"]

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: local-secret-key
    ports: ["9000:9000"]

  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://s3:9000 local local-secret-key; do sleep 1; done
        mc mb --ignore-existing local/uploads
        mc anonymous set none local/uploads

volumes:
  pgdata:
  mlmodel:
