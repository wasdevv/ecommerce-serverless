include classpath("application.conf")

# Espelha a topologia da AWS: fila principal com redrive para DLQ após 5 tentativas.
queues {
  order-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "order-events-dlq"
      maxReceiveCount = 5
    }
  }
  order-events-dlq {}
}
